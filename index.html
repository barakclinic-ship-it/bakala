<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>bakala</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="bakala">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--surface:#f6f8fc;--tint:#e8f0fe;--tint2:#d3e3fd;
  --blue:#5b8def;--blue-d:#3f6fd8;--pink:#f062a6;--ink:#1f1f1f;--ink2:#444746;--muted:#747775;
  --line:#e3e6ea;--ok:#188038;--bad:#d93025;--shadow:0 1px 3px rgba(60,64,67,.15),0 4px 12px rgba(60,64,67,.08)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;font-size:19px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}

/* ============ GAME (decoy) ============ */
#game{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#e9f7ff 0%,#cfeefe 55%,#b4e2fb 100%);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Fredoka,Heebo,sans-serif;display:flex;flex-direction:column;align-items:center;padding:calc(20px + env(safe-area-inset-top)) 16px 20px}
#game h1{margin:4px 0 2px;font-size:34px;color:#1e6fb8;font-weight:700;letter-spacing:.5px}
#game .moves{color:#3d8fd1;font-size:18px;margin-bottom:14px}
.board{display:grid;gap:5px;width:min(92vw,440px);aspect-ratio:1;background:#fff;padding:6px;border-radius:24px;box-shadow:0 8px 28px rgba(30,111,184,.18);position:relative;z-index:2}
.tile{border-radius:12px;background-repeat:no-repeat;background-color:#f3fbff;transition:transform .15s,box-shadow .15s;cursor:pointer}
.tile.sel{transform:scale(.92);box-shadow:0 0 0 4px #ffb703}
.board.won .tile{border-radius:0;transition:border-radius .4s}
.board.won{gap:0}
.levels{display:flex;gap:10px;margin-top:18px;position:relative;z-index:2}
.levels button{background:#fff;color:#1e6fb8;font-family:inherit;font-weight:700;font-size:19px;padding:10px 20px;border-radius:30px;box-shadow:0 3px 10px rgba(30,111,184,.15)}
.levels button.on{background:#ffb703;color:#fff}
.winmsg{font-size:30px;color:#ff7aa8;font-weight:700;height:44px;margin-top:12px;position:relative;z-index:2;opacity:0;transition:.3s}
.winmsg.on{opacity:1}
.bub{position:absolute;bottom:-40px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.8);animation:rise linear infinite;z-index:1}
@keyframes rise{to{transform:translateY(-115vh)}}
.weed{position:absolute;bottom:-10px;width:22px;border-radius:20px 20px 0 0;background:#7fd3a6;transform-origin:bottom;animation:sway 3s ease-in-out infinite alternate;z-index:1}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

/* logo */
.logo{width:96px;height:96px;margin:0 auto;display:block;object-fit:contain}
.logo.sm{width:44px;height:44px;margin:0}
.brand{font-family:Fredoka,Heebo,sans-serif;font-weight:700;letter-spacing:.5px;background:linear-gradient(90deg,var(--pink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}

/* gate screens */
.gate{padding-top:40px}
.gate h1{text-align:center;font-size:34px;margin:10px 0 26px}
.gx{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);z-index:5}
.field{position:relative;margin:14px 0}
.field .q{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--ink2);margin-bottom:8px;font-size:19px}
.num{width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--blue-d);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.inp{width:100%;font-size:21px;padding:15px 18px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--tint)}
.inp.ltr{direction:ltr;text-align:right}
.qinp{font-weight:500;background:var(--surface);border-color:transparent;margin-bottom:8px}
textarea.inp{min-height:96px;resize:vertical}
.primary{display:block;width:100%;background:var(--blue);color:#fff;font-weight:700;font-size:21px;padding:17px;border-radius:30px;margin-top:22px;box-shadow:0 2px 6px rgba(91,141,239,.35);transition:background .15s}
.primary:active{background:var(--blue-d)}
.primary:disabled{opacity:.55}
.secondary{display:block;width:100%;color:var(--blue-d);font-weight:700;font-size:19px;padding:15px;border-radius:30px;margin-top:10px}
.secondary:active{background:var(--tint)}
.err{color:var(--bad);font-weight:500;text-align:center;margin-top:14px;min-height:1.4em}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:12px}
.top h1{flex:1;margin:0;font-size:27px}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.icon-btn:active{background:var(--surface)}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:30px;padding:4px 18px;margin:4px 0 18px;color:var(--muted)}
.searchbox input{flex:1;border:0;background:none;outline:none;font-size:19px;padding:12px 0}
.count{color:var(--muted);font-size:16px;margin:0 6px 8px}

/* list */
.list{background:#fff;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:right;cursor:pointer}
.item:last-child{border-bottom:0}
.item:active{background:var(--surface)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:21px;flex:none}
.av.big{width:84px;height:84px;font-size:38px;margin:0 auto}
.meta{flex:1;min-width:0}
.meta .t{font-weight:500;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .u{color:var(--muted);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.qcopy{height:42px;padding:0 16px;border-radius:21px;background:var(--tint);color:var(--blue-d);font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;flex:none}
.qcopy svg.i{width:19px;height:19px}
.qcopy.done{background:#e6f4ea;color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty img{width:110px;opacity:.35;margin-bottom:8px}

/* detail */
.dhead{text-align:center;padding:10px 0 22px}
.dhead h2{font-size:27px;margin:14px 0 0;font-weight:700;word-break:break-word}
.card{background:var(--surface);border-radius:20px;padding:6px 0;margin-bottom:14px}
.frow{display:flex;align-items:center;gap:8px;padding:12px 18px}
.frow+.frow{border-top:1px solid var(--line)}
.frow .fx{flex:1;min-width:0}
.frow .lb{color:var(--muted);font-size:15px}
.frow .vl{font-size:23px;font-family:"SF Mono",Consolas,Menlo,monospace;direction:ltr;text-align:right;word-break:break-all;letter-spacing:.3px}
.frow .vl.note{font-family:inherit;direction:rtl;font-size:19px;white-space:pre-wrap;letter-spacing:0}
.bigcopy{height:50px;padding:0 22px;border-radius:25px;background:var(--blue);color:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px;flex:none}
.bigcopy.done{background:var(--ok)}
.bigcopy svg.i{width:21px;height:21px}
.gosite{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:linear-gradient(90deg,var(--pink),var(--blue));color:#fff;font-weight:700;font-size:20px;padding:16px;border-radius:30px;margin:0 0 14px;box-shadow:0 3px 10px rgba(91,141,239,.3)}
.gosite small{font-weight:500;opacity:.85;font-size:15px}
.dactions{display:flex;gap:10px;margin-top:8px}
.dactions button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:30px;font-weight:700;font-size:18px;border:1.5px solid var(--line)}
.dactions .del{color:var(--bad)}
.dactions .ed{color:var(--blue-d)}

/* fab */
.fab{height:62px;padding:0 26px 0 22px;border-radius:20px;background:var(--tint2);color:#0b3a8c;font-weight:700;font-size:19px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);z-index:6}
.fabs{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:24px;display:flex;flex-direction:row-reverse;gap:12px;z-index:6}
.fab svg.i{width:26px;height:26px}

/* sheets */
.modal{position:fixed;inset:0;background:rgba(32,33,36,.4);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.on{display:flex;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:680px;border-radius:28px 28px 0 0;padding:10px 18px calc(26px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;animation:up .2s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:23px;margin:0 0 6px;font-weight:700}
.sheet label{display:block;color:var(--ink2);font-weight:500;margin:16px 0 7px;font-size:17px}
.pw{display:flex;gap:8px}
.pw .inp{flex:1}
.gen{width:56px;border-radius:14px;background:var(--tint);color:var(--blue-d);display:grid;place-items:center;flex:none}
.mrow{display:flex;align-items:center;gap:14px;width:100%;padding:16px 8px;border-radius:14px;font-size:19px;text-align:right}
.mrow:active{background:var(--surface)}
.mrow .ic{width:42px;height:42px;border-radius:50%;background:var(--tint);color:var(--blue-d);display:grid;place-items:center;flex:none}
.mrow.red{color:var(--bad)}.mrow.red .ic{background:#fce8e6;color:var(--bad)}
.sep{height:1px;background:var(--line);margin:6px 0}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.tog{display:flex;align-items:center;gap:14px;padding:16px 4px;font-size:19px;border-bottom:1px solid var(--line)}
.tog span{flex:1}
.sw{appearance:none;-webkit-appearance:none;width:56px;height:32px;border-radius:16px;background:#c4c7c5;position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.sw::before{content:"";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw:checked{background:var(--blue)}
.sw:checked::before{right:28px}
.camwrap{width:180px;height:180px;border-radius:50%;overflow:hidden;margin:20px auto 10px;background:var(--surface);border:4px solid var(--tint2);transition:border-color .2s}
.camwrap.ok{border-color:#34a853}.camwrap.bad{border-color:var(--pink)}
.camwrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.fstat{text-align:center;color:var(--ink2);font-weight:500;min-height:1.5em}
#camv{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;top:0;left:0}
.banner{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#fde7f1,#e8f0fe);border-radius:18px;padding:14px 16px;margin:0 0 16px}
.banner .bt{flex:1;font-size:17px;color:var(--ink2);font-weight:500}
.banner .bgo{background:var(--blue);color:#fff;font-weight:700;font-size:17px;padding:11px 16px;border-radius:22px;flex:none}
.banner .bx{color:var(--muted);width:36px;height:36px;display:grid;place-items:center;flex:none}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(10px);background:#303134;color:#fff;padding:12px 22px;border-radius:12px;font-weight:500;opacity:0;transition:.2s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>

<!-- ============ GAME ============ -->
<div id="game">
  <h1>🐠 פאזל דגים 🐟</h1>
  <div class="moves" id="moves">מהלכים: 0</div>
  <div class="board" id="board"></div>
  <div class="winmsg" id="winmsg">כל הכבוד! 🎉</div>
  <div class="levels">
    <button data-n="3" class="on">קל</button>
    <button data-n="4">בינוני</button>
    <button data-n="5">קשה</button>
  </div>
</div>

<div class="wrap">
  <!-- SETUP -->
  <section id="setup" class="gate hidden">
    <button class="gx" data-togame aria-label="סגור"><svg class="i"><use href="#i-x"/></svg></button>
    <img class="logo" data-logo alt="">
    <h1 class="brand">bakala</h1>
    <div id="setupQs"></div>
    <div class="err" id="setupErr"></div>
    <button class="primary" id="setupBtn">התחלה</button>
    <button class="secondary" id="setupImport">שחזור מגיבוי</button>
  </section>

  <!-- LOGIN -->
  <section id="login" class="gate hidden">
    <button class="gx" data-togame aria-label="סגור"><svg class="i"><use href="#i-x"/></svg></button>
    <img class="logo" data-logo alt="">
    <h1 class="brand">bakala</h1>
    <div id="loginQs"></div>
    <div class="err" id="loginErr"></div>
    <button class="primary" id="loginBtn">כניסה</button>
  </section>

  <!-- LIST -->
  <section id="listView" class="hidden">
    <div class="top">
      <img class="logo sm" data-logo alt="">
      <h1 class="brand">bakala</h1>
      <button class="icon-btn" id="lockBtn" aria-label="נעילה"><svg class="i"><use href="#i-lock"/></svg></button>
      <button class="icon-btn" id="menuBtn" aria-label="הגדרות"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
    <label class="searchbox"><svg class="i"><use href="#i-search"/></svg><input id="search" placeholder="חיפוש" autocomplete="off"></label>
    <div id="bakBanner"></div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </section>

  <!-- DETAIL -->
  <section id="detailView" class="hidden">
    <div class="top">
      <button class="icon-btn" id="backBtn" aria-label="חזרה"><svg class="i"><use href="#i-back"/></svg></button>
      <h1></h1>
    </div>
    <div id="detail"></div>
  </section>
</div>

<div class="fabs hidden" id="fabs">
  <button class="fab" id="addBtn"><svg class="i"><use href="#i-plus"/></svg>הוספה</button>
  <button class="fab" id="bakBtn"><svg class="i"><use href="#i-down"/></svg>גיבוי</button>
</div>

<!-- EDIT -->
<div class="modal" id="editModal"><div class="sheet">
  <div class="grab"></div>
  <h2 id="editTitle">חדש</h2>
  <label>שם</label>
  <input class="inp" id="fTitle" autocomplete="off">
  <label>קישור לאתר</label>
  <input class="inp ltr" id="fUrl" type="url" inputmode="url" placeholder="https://" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label>שם משתמש</label>
  <input class="inp ltr" id="fUser" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label>סיסמה / קוד</label>
  <div class="pw"><input class="inp ltr" id="fPass" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="gen" id="genBtn" type="button" aria-label="צור סיסמה"><svg class="i"><use href="#i-dice"/></svg></button></div>
  <label>הערות</label>
  <textarea class="inp" id="fNote"></textarea>
  <button class="primary" id="saveBtn">שמירה</button>
  <button class="secondary" data-close>ביטול</button>
</div></div>

<!-- MENU -->
<div class="modal" id="menuModal"><div class="sheet">
  <div class="grab"></div>
  <h2>הגדרות</h2>

(function decor(){

function buildPuzzleImage(cb){
  const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=600;const x=c.getContext('2d');
    const gr=x.createLinearGradient(0,0,0,600);gr.addColorStop(0,'#fff6fb');gr.addColorStop(1,'#e3efff');x.fillStyle=gr;x.fillRect(0,0,600,600);
    x.fillStyle='rgba(91,141,239,.12)';
    for(let i=0;i<22;i++){x.beginPath();x.arc(Math.random()*600,Math.random()*600,6+Math.random()*22,0,7);x.fill()}
    x.fillStyle='#ffe08a';x.beginPath();x.ellipse(300,585,330,45,0,0,7);x.fill();
    x.drawImage(im,40,30,520,520);
    puzzleImg=c.toDataURL('image/jpeg',.88);cb();
  };im.src=LOGO;
}
function shuffle(){
  order=[...Array(N*N).keys()];
  do{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}while(order.every((v,i)=>v===i));
  sel=-1;moves=0;$('winmsg').classList.remove('on');$('board').classList.remove('won');drawBoard();
}
function drawBoard(){
  const b=$('board');b.style.gridTemplateColumns=`repeat(${N},1fr)`;
  b.innerHTML=order.map((p,i)=>{const r=Math.floor(p/N),c=p%N,pct=100/(N-1);
    return`<div class="tile${i===sel?' sel':''}" data-i="${i}" style="background-image:url(${puzzleImg});background-size:${N*100}% ${N*100}%;background-position:${c*pct}% ${r*pct}%"></div>`}).join('');
  $('moves').textContent='מהלכים: '+moves;
}
let multi=false;
$('board').addEventListener('click',e=>{
  if(multi)return;
  const t=e.target.closest('.tile');if(!t||$('board').classList.contains('won'))return;
  const i=+t.dataset.i;
  if(sel<0){sel=i}else if(sel===i){sel=-1}else{[order[sel],order[i]]=[order[i],order[sel]];sel=-1;moves++}
  drawBoard();
  if(order.every((v,k)=>v===k)){$('board').classList.add('won');$('winmsg').classList.add('on');setTimeout(shuffle,3500)}
});
document.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.levels button').forEach(x=>x.classList.toggle('on',x===b));N=+b.dataset.n;shuffle()});

/* secret: 3-finger swipe right */
let sw=null;
const avgX=t=>[...t].reduce((s,p)=>s+p.clientX,0)/t.length;
const avgY=t=>[...t].reduce((s,p)=>s+p.clientY,0)/t.length;
$('game').addEventListener('touchstart',e=>{
  if(e.touches.length>=2)multi=true;
  if(e.touches.length>=3){sw={x:avgX(e.touches),y:avgY(e.touches)};sel=-1}
},{passive:true});
$('game').addEventListener('touchmove',e=>{
  if(sw&&e.touches.length>=3){sw.lx=avgX(e.touches);sw.ly=avgY(e.touches)}
},{passive:true});
$('game').addEventListener('touchend',e=>{
  if(sw&&sw.lx!=null){const dx=sw.lx-sw.x,dy=Math.abs(sw.ly-sw.y);if(dx>70&&dx>dy*1.5)openGate()}
  if(e.touches.length===0){sw=null;setTimeout(()=>multi=false,300)}
},{passive:true});

document.addEventListener('keydown',e=>{

  if(arrows.length>=3){arrows=[];openGate()}
});

/* =================== CRYPTO =================== */
const b64=u=>{u=new Uint8Array(u);let s='';for(const b of u)s+=String.fromCharCode(b);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const norm=s=>(s||'').normalize('NFKC').toLowerCase().replace(/[\s'"`׳״’‘\-_.,?!]/g,'');
async function pbkdf(pass,salt){
  const base=await subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
  return subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const aesKey=raw=>subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function enc(key,bytes){const iv=rnd(12);return{iv:b64(iv),ct:b64(await subtle.encrypt({name:'AES-GCM',iv},key,bytes))}}
async function dec(key,o){return new Uint8Array(await subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)))}
async function comboKey(sec){const a=new Uint8Array(sec.length*32);sec.forEach((s,i)=>a.set(s,i*32));return aesKey(await subtle.digest('SHA-256',a))}
function combos3(){const r=[];for(let a=0;a<5;a++)for(let b=a+1;b<5;b++)for(let c=b+1;c<5;c++)r.push([a,b,c]);return r}
async function buildKeys(qs,ans,master){
  const secrets=qs.map(()=>rnd(32)),q=[],combos={};
  for(let i=0;i<5;i++){
    const variants=[];
    for(const v of ans[i]){const salt=rnd(16);variants.push({salt:b64(salt),...await enc(await pbkdf(v,salt),secrets[i])})}
    q.push({text:qs[i],variants});
  }
  for(const c of combos3())combos[c.join(',')]=await enc(await comboKey(c.map(i=>secrets[i])),master);
  return{q,combos};
}

const PAL=[['#e8f0fe','#1a56c4'],['#fde7f1','#c2185b'],['#e6f4ea','#137333'],['#fef7e0','#b06000'],['#f3e8fd','#8430ce'],['#e4f7fb','#007b83'],['#feefe3','#c26401']];
function av(title,big){let h=0;for(const c of title)h=(h*31+c.charCodeAt(0))>>>0;const[bg,fg]=PAL[h%PAL.length];return`<div class="av${big?' big':''}" style="background:${bg};color:${fg}">${esc((title.trim()[0]||'?').toUpperCase())}</div>`}

/* answer fields with fixed question text */
function ansFields(prefix,qs){
  return qs.map((q,i)=>`<div class="field">
    <div class="q"><span class="num">${i+1}</span>${esc(q)}</div>
    <input class="inp" id="${prefix}a${i}" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>`).join('');
}
/* editable question + answer (settings only) */
function qaFields(prefix,qs){
  return qs.map((q,i)=>`<div class="field">
    <input class="inp qinp" id="${prefix}q${i}" value="${esc(q)}" autocomplete="off">
    <input class="inp" id="${prefix}a${i}" placeholder="תשובה" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>`).join('');
}
function readAns(prefix,qs,errEl){
  const outQ=[],ans=[];
  for(let i=0;i<5;i++){
    const q=qs?qs[i]:$(prefix+'q'+i).value.trim();
    const v=[...new Set($(prefix+'a'+i).value.split('/').map(norm).filter(Boolean))];
    if(!q||!v.length){$(errEl).textContent='צריך למלא את כל 5 התשובות';return null}
    outQ.push(q);ans.push(v);
  }
  $(errEl).textContent='';return{qs:outQ,ans};
}

const fails=()=>JSON.parse(localStorage.getItem(FAILS)||'{"n":0,"t":0}');
function lockLeft(){const f=fails();return f.n>=5?Math.max(0,f.t-Date.now()):0}
function addFail(){const f=fails();f.n++;if(f.n>=5)f.t=Date.now()+30000*(f.n-4);localStorage.setItem(FAILS,JSON.stringify(f))}
$('loginBtn').onclick=async()=>{
  askPerms();
  const w=lockLeft();
  if(w){$('loginErr').textContent=`נסה שוב בעוד ${Math.ceil(w/1000)} שניות`;return}
  const answered=store.q.map((_,i)=>({i,v:norm($('la'+i).value)})).filter(x=>x.v);
  if(answered.length<3){$('loginErr').textContent='צריך לענות על 3 שאלות לפחות';return}
  const b=$('loginBtn');b.disabled=true;b.textContent='בודק…';$('loginErr').textContent='';
  const got={};
  for(const{i,v}of answered){
    for(const vr of store.q[i].variants){try{got[i]=await dec(await pbkdf(v,unb64(vr.salt)),vr);break}catch(e){}}
    if(Object.keys(got).length>=3)break;
  }
  const idx=Object.keys(got).map(Number).sort((a,b)=>a-b).slice(0,3);
  try{
    if(idx.length<3)throw 0;
    masterRaw=await dec(await comboKey(idx.map(i=>got[i])),store.combos[idx.join(',')]);
    mkey=await aesKey(masterRaw);
    entries=store.vault?JSON.parse(td.decode(await dec(mkey,store.vault))):[];
    localStorage.removeItem(FAILS);openList();
  }catch(e){addFail();$('loginErr').textContent='אין מספיק תשובות נכונות'}
  b.disabled=false;b.textContent='כניסה';
};

function cleanUrl(u){
  u=(u||'').trim();if(!u)return'';
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u.replace(/^\/+/,'');
  try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return''}
}
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}};
const newId=()=>b64(rnd(9)).replace(/[^a-z0-9]/gi,'');

const COLS={
  title:['שם','כותרת','שירות','name','title','service'],
  url:['אתר','קישור','כתובת','url','website','site','link','origin'],
  user:['שםמשתמש','משתמש','מייל','אימייל','username','user','login','email','e-mail'],
  pass:['סיסמה','סיסמא','קוד','password','pass','pwd','code'],
  note:['הערות','הערה','notes','note','comment','comments']
};
function pick(row,keys){for(const k in row){const n=norm(k);if(keys.some(x=>norm(x)===n))return String(row[k]??'').trim()}return''}
$('xlsFile').onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f||!mkey)return;
  try{await loadXLSX()}catch(e){toast('אין חיבור לאינטרנט');return}
  try{
    const wb=XLSX.read(await f.arrayBuffer());
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const seen=new Set(entries.map(e=>norm(e.title)+'|'+norm(e.user)+'|'+e.pass));
    let added=0,skipped=0;
    for(const r of rows){
      const d={title:pick(r,COLS.title),url:cleanUrl(pick(r,COLS.url)),user:pick(r,COLS.user),pass:pick(r,COLS.pass),note:pick(r,COLS.note)};
      if(!d.title)d.title=host(d.url)||d.user;
      if(!d.title||(!d.user&&!d.pass&&!d.note)){skipped++;continue}
      const key=norm(d.title)+'|'+norm(d.user)+'|'+d.pass;
      if(seen.has(key)){skipped++;continue}
      seen.add(key);entries.push({id:newId(),...d});added++;
    }
    if(!added){toast('לא נמצאו שורות חדשות');return}
    await saveVault();renderList();toast(`נוספו ${added}`+(skipped?` · דולגו ${skipped}`:''));autoBak();
  }catch(e){alert('לא הצלחתי לקרוא את הקובץ')}
};

/* weekly backup by email (share sheet) */
const WEEK=7*24*3600*1000;
let bannerSnoozed=false;
const DAY=24*3600*1000;
async function sendMail(){
  if(!store.mailUrl)return false;
  try{
    await fetch(store.mailUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({file:'bakala-backup-'+new Date().toISOString().slice(0,10)+'.txt',data:JSON.stringify(store)})});
    store.lastMailBak=Date.now();persist();return true;
  }catch(e){return false}
}
function autoMail(){if(store&&store.mailUrl&&Date.now()-(store.lastMailBak||0)>DAY)sendMail()}
function checkMailBak(){
  if(store.mailUrl){$('bakBanner').innerHTML='';autoMail();return}
  const due=!bannerSnoozed&&entries.length&&Date.now()-(store.lastMailBak||0)>WEEK;
  $('bakBanner').innerHTML=due?`<div class="banner"><div class="bt">${store.lastMailBak?'עבר שבוע מהגיבוי האחרון':'עוד לא שלחת גיבוי למייל'}</div><button class="bgo" id="bGo">שלח למייל</button><button class="bx" id="bX" aria-label="אחר כך">${ico('x')}</button></div>`:'';
  if(due){$('bGo').onclick=shareBak;$('bX').onclick=()=>{bannerSnoozed=true;checkMailBak()}}
}
async function shareBak(){
  const name='bakala-backup-'+new Date().toISOString().slice(0,10)+'.txt';
  const file=new File([JSON.stringify(store)],name,{type:'text/plain'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],title:'bakala backup '+new Date().toLocaleDateString('he-IL'),text:'גיבוי bakala מוצפן'});
      store.lastMailBak=Date.now();persist();checkMailBak();toast('נשלח ✓');
    }catch(e){if(e.name!=='AbortError')toast('השיתוף נכשל')}

    downloadBak();store.lastMailBak=Date.now();persist();checkMailBak();
    toast('הקובץ ירד – צרף אותו למייל');
  }
}

window.addEventListener('deviceorientation',e=>{
  if(!guardOn||!guard.tilt||e.beta==null)return;
  const b=e.beta,g=e.gamma||0;
  if(ori.b==null){ori.b=b;ori.g=g;return}
  if(!tiltBad){
    if(Math.abs(b-ori.b)>TILT_ON||Math.abs(g-ori.g)>TILT_ON){tiltBad=true;faceOkSince=0;ori.fb=ori.b;ori.fg=ori.g;ori.okSince=0;evalGuard();return}
    ori.b+=(b-ori.b)*.03;ori.g+=(g-ori.g)*.03;
  }else if(!(guard.cam&&camStream)){
    if(Math.abs(b-ori.fb)<TILT_BACK&&Math.abs(g-ori.fg)<TILT_BACK){
      if(!ori.okSince)ori.okSince=Date.now();
      else if(Date.now()-ori.okSince>400){tiltBad=false;ori.b=b;ori.g=g;evalGuard()}
    }else ori.okSince=0;
  }
});

/* camera + face recognition */
let faceP=null;
function loadFaceApi(){
  if(faceP)return faceP;
  faceP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=FACE_CDN+'dist/face-api.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})
    .then(()=>Promise.all([faceapi.nets.tinyFaceDetector,faceapi.nets.faceLandmark68Net,faceapi.nets.faceRecognitionNet].map(n=>n.loadFromUri(FACE_CDN+'model'))))
    .catch(e=>{faceP=null;throw e});
  return faceP;
}
async function startCam(){
  if(camStream&&camStream.getVideoTracks()[0]?.readyState==='live')return true;
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240}},audio:false});
    for(const v of [$('camv'),$('camPrev')]){v.srcObject=camStream;v.play().catch(()=>{})}
    return true;
  }catch(e){camStream=null;return false}
}
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}$('camv').srcObject=null;$('camPrev').srcObject=null}
const scan=()=>faceapi.detectAllFaces($('camv'),new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptors();
function isMe(dets){
  if(dets.length!==1)return false;
  if(!faces.length)return true;
  return faces.some(f=>faceapi.euclideanDistance(f,dets[0].descriptor)<.5);
}
function faceStatus(dets,ok){
  if(!$('guardModal').classList.contains('on'))return;
  const w=$('camWrap');w.classList.toggle('ok',ok);w.classList.toggle('bad',!ok);
  $('fStat').textContent=!dets.length?'לא רואה פנים':dets.length>1?'יש כאן יותר מאדם אחד':ok?(faces.length?'זה אתה ✓':'פנים זוהו ✓ (לא רשום – כל פנים ייחשבו)'):'לא מזוהה';
}
async function faceLoop(){
  if(looping)return;looping=true;
  while(guardOn&&guard.cam&&camStream){
    try{
      if($('camv').readyState>=2){
        const dets=await scan(),ok=isMe(dets);
        const now=Date.now();
        if(ok){
          lastFaceOk=now;if(!faceOkSince)faceOkSince=now;
          // only my face, steadily for ~1s → back to the passwords (also clears a sharp-movement hide)
          if((faceBad||tiltBad)&&now-faceOkSince>=FACE_BACK_MS){faceBad=false;if(tiltBad){tiltBad=false;ori.b=null}evalGuard()}
        }else{
          faceOkSince=0;
          // someone else / an extra face → hide at once; no face at all → after a short grace
          if(!faceBad&&(dets.length>1||(dets.length===1&&gmode==='in')||now-lastFaceOk>(gmode==='pre'?2500:1200))){faceBad=true;evalGuard()}
        }
        faceStatus(dets,ok);
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r,curtain?350:400));
  }
  looping=false;
}
async function startCamGuard(){
  if(!await startCam()){toast('אין גישה למצלמה');return false}
  try{await loadFaceApi()}catch(e){toast('זיהוי הפנים לא נטען – צריך אינטרנט');return false}
  lastFaceOk=Date.now();faceLoop();return true;
}
/* mode 'pre' = questions screen (any problem → back to puzzle, no face identity yet)
   mode 'in'  = unlocked (curtain that lifts when it's you again) */
async function startGuard(mode){
  loadGuardCfg();
  if(mode==='in')await loadFaces();else faces=[];
  gmode=mode;guardOn=true;tiltBad=false;faceBad=false;ori.b=null;lastFaceOk=Date.now();
  if(guard.cam){if(camStream&&looping)return;startCamGuard()}
}
function stopGuard(){awayLock=false;clearTimeout(awayT);guardOn=false;stopCam();tiltBad=false;faceBad=false;curtain=false;clearTimeout(curtainT)}
/* leaving the app: short absence → puzzle + 3-finger swipe only; ≥1 min → questions again */
const AWAY_MAX=60*1000;
let awayLock=false,awayT=null,hiddenAt=0;
function liftAway(){
  dropResume();if(!guardOn)startGuard('in');
  awayLock=false;clearTimeout(awayT);curtain=false;clearTimeout(curtainT);
  tiltBad=false;faceBad=false;ori.b=null;lastFaceOk=Date.now();
  $('game').classList.add('hidden');bump();
}
document.addEventListener('visibilitychange',()=>{
  if(!mkey||gmode!=='in')return;
  if(document.visibilityState==='hidden'){
    hiddenAt=Date.now();awayLock=true;saveResume();sel=-1;closeM();
    $('game').classList.remove('hidden');clearTimeout(awayT);
  }else{
    dropResume();
    if(Date.now()-hiddenAt>=AWAY_MAX){toGame();return}
    clearTimeout(awayT);awayT=setTimeout(toGame,3*60*1000);
    if(guard.cam){startCam().then(ok=>{if(ok)faceLoop()})}
  }
});

/* settings sheet */
$('guardBtn').onclick=async()=>{
  closeM();$('gTilt').checked=guard.tilt;$('gCam').checked=guard.cam;
  $('faceBox').classList.toggle('hidden',!guard.cam);$('fStat').textContent='';
  openM('guardModal');
  if(guard.cam&&camStream){$('camPrev').srcObject=camStream;$('camPrev').play().catch(()=>{})}
};
$('gTilt').onchange=e=>{askPerms();guard.tilt=e.target.checked;saveGuardCfg();ori.b=null;tiltBad=false;evalGuard()};
$('gCam').onchange=async e=>{
  guard.cam=e.target.checked;saveGuardCfg();$('faceBox').classList.toggle('hidden',!guard.cam);
  if(guard.cam){$('fStat').textContent='טוען…';if(!await startCamGuard()){guard.cam=false;e.target.checked=false;saveGuardCfg();$('faceBox').classList.add('hidden')}}
  else{stopCam();faceBad=false;evalGuard()}
};
$('enrollBtn').onclick=async()=>{
  const b=$('enrollBtn');b.disabled=true;
  try{
    if(!camStream&&!await startCam())throw 0;
    await loadFaceApi();
    const got=[];
    for(let k=0;k<20&&got.length<6;k++){
      b.textContent=`מסתכל עליך… ${got.length}/6`;
      const d=await scan();
      if(d.length===1)got.push(Array.from(d[0].descriptor));
      await new Promise(r=>setTimeout(r,250));
    }
    if(got.length<4){toast('לא הצלחתי – נסה באור טוב יותר');}
    else{faces=got;await saveFaces();lastFaceOk=Date.now();toast('הפנים נרשמו ✓')}
  }catch(e){toast('אין גישה למצלמה')}
  b.disabled=false;b.textContent='רישום הפנים שלי';
};
$('unenrollBtn').onclick=async()=>{if(!confirm('למחוק את רישום הפנים?'))return;faces=[];await saveFaces();toast('נמחק')};

/* survive a page reload/tab discard during a short absence (key kept ≤1 min, this tab only) */
const RESUME='bakala_resume';
function saveResume(){if(mkey&&masterRaw&&gmode==='in'){try{sessionStorage.setItem(RESUME,JSON.stringify({m:b64(masterRaw),t:hiddenAt||Date.now()}))}catch(e){}}}
function dropResume(){try{sessionStorage.removeItem(RESUME)}catch(e){}}
window.addEventListener('pagehide',()=>{if(mkey&&gmode==='in'){if(!awayLock){hiddenAt=Date.now();awayLock=true}saveResume()}});
async function tryResume(){
  let r=null;try{r=JSON.parse(sessionStorage.getItem(RESUME))}catch(e){}
  dropResume();store=load();
  if(!r||!store||store.v!==1||Date.now()-r.t>=AWAY_MAX)return;
  try{
    masterRaw=unb64(r.m);mkey=await aesKey(masterRaw);
    entries=store.vault?JSON.parse(td.decode(await dec(mkey,store.vault))):[];
    gmode='in';awayLock=true;hiddenAt=r.t;
    show('listView');renderList();
    awayT=setTimeout(toGame,3*60*1000);
  }catch(e){mkey=null;masterRaw=null;entries=[]}
}

/* =================== START =================== */
document.querySelectorAll('[data-logo]').forEach(i=>i.src=LOGO);
buildPuzzleImage(shuffle);
tryResume();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
